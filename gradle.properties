# Gradle's own default is 512 MB, which is not enough to dex this app any more: D8 merges every
# dependency's classes in one pass and dies with an OutOfMemoryError partway through
# `:app:mergeExtDexDebug`. The failure is a bare "Error while merging dex archives" with the real
# cause several `Caused by:` lines down, so it reads like a broken dependency rather than a build
# that ran out of room.
#
# 3 GB, on a machine with 7. Room to spare rather than the least that works: the number that only
# just fits today fails again the next time a dependency is added, and the failure it produces does
# not say so.
org.gradle.jvmargs=-Xmx3g

android.useAndroidX=true
kotlin.code.style=official
